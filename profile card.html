<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2332 50%, #0f1419 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            perspective: 1000px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
            pointer-events: none;
            transition: all 0.6s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 80px rgba(99, 102, 241, 0.2);
        }

        .card:hover::before {
            top: -25%;
            right: -25%;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .profile-image-wrapper {
            margin-bottom: 30px;
            text-align: center;
            animation: slideInDown 0.6s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 50px;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
            position: relative;
            border: 4px solid rgba(255, 255, 255, 0.8);
        }

        .profile-image:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.4);
        }

        .status-indicator {
            width: 16px;
            height: 16px;
            background: #10b981;
            border: 3px solid white;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }
        }

        .info-header {
            text-align: center;
            margin-bottom: 25px;
            animation: slideInDown 0.6s ease-out 0.1s both;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: #0a1428;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .bio {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
            padding: 20px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            animation: slideInDown 0.6s ease-out 0.2s both;
        }

        .stat {
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 12px;
        }

        .stat:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-4px);
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            color: #6366f1;
            display: block;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 30px 0;
            animation: slideInDown 0.6s ease-out 0.3s both;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(99, 102, 241, 0.1);
            color: #6366f1;
            border: 2px solid #6366f1;
        }

        .btn-secondary:hover {
            background: #6366f1;
            color: white;
            transform: translateY(-2px);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            animation: slideInDown 0.6s ease-out 0.4s both;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            color: #6366f1;
            text-decoration: none;
        }

        .social-icon:hover {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            transform: translateY(-6px) scale(1.15);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #6366f1;
            color: white;
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #0a1428;
            margin-bottom: 20px;
        }

        .modal-text {
            color: #64748b;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            .name {
                font-size: 24px;
            }

            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .modal-content {
                padding: 30px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="content">
                <!-- Profile Section -->
                <div class="profile-image-wrapper">
                    <div class="profile-image">
                            😍
                        <div class="status-indicator"></div>
                    </div>
                </div>

                <!-- Info Header -->
                <div class="info-header">
                    <div class="title">Cybersecurity Engineer</div>
                    <h1 class="name">RafDOE</h1>
                    <p class="bio">Creative developer passionate about building beautiful digital experiences</p>
                </div>

                <!-- Stats Section -->
                <div class="stats">
                    <div class="stat" onclick="showDetails('experience')">
                        <span class="stat-number">5+</span>
                        <span class="stat-label">Years</span>
                    </div>
                    <div class="stat" onclick="showDetails('projects')">
                        <span class="stat-number">50+</span>
                        <span class="stat-label">Projects</span>
                    </div>
                    <div class="stat" onclick="showDetails('clients')">
                        <span class="stat-number">30+</span>
                        <span class="stat-label">Clients</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="showDetails('contact')">
                        ✉️ Contact
                    </button>
                    <button class="btn btn-secondary" onclick="showDetails('resume')">
                        📄 Resume
                    </button>
                </div>

                <!-- Social Links -->
                <div class="social-links">
                    <a href="#" class="social-icon" title="GitHub">
                        <span>💻</span>
                    </a>
                    <a href="#" class="social-icon" title="LinkedIn">
                        <span>💼</span>
                    </a>
                    <a href="#" class="social-icon" title="Twitter">
                        <span>𝕏</span>
                    </a>
                    <a href="#" class="social-icon" title="Email">
                        <span>📧</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Details -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 class="modal-title" id="modalTitle">Title</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const modalContent = {
            experience: {
                title: "Experience",
                content: `
                    <p class="modal-text">5+ years of experience in web development with expertise in:</p>
                    <p class="modal-text">
                        • Frontend Development (React, Vue, HTML/CSS)<br>
                        • Backend Development (Node.js, Python, Database)<br>
                        • UI/UX Design & Interaction Design<br>
                        • Project Management & Team Leadership
                    </p>
                `
            },
            projects: {
                title: "Featured Projects",
                content: `
                    <p class="modal-text">
                        <strong>E-Commerce Platform</strong><br>
                        Modern shopping experience with real-time inventory
                    </p>
                    <p class="modal-text">
                        <strong>Social Media App</strong><br>
                        Full-stack application with 50K+ active users
                    </p>
                    <p class="modal-text">
                        <strong>Analytics Dashboard</strong><br>
                        Real-time data visualization and insights
                    </p>
                `
            },
            clients: {
                title: "Clients & Collaborators",
                content: `
                    <p class="modal-text">
                        Worked with diverse clients ranging from startups to enterprises including tech companies, 
                        e-commerce businesses, and creative agencies across Southeast Asia.
                    </p>
                    <p class="modal-text">
                        Current focus: Building innovative solutions for digital transformation
                    </p>
                `
            },
            contact: {
                title: "Get In Touch",
                content: `
                    <p class="modal-text">
                        <strong>Email:</strong> your.email@example.com<br>
                        <strong>Phone:</strong> +62 (XXX) XXX-XXXX<br>
                        <strong>Location:</strong> Jakarta, Indonesia
                    </p>
                    <p class="modal-text">
                        Available for freelance projects and full-time opportunities. 
                        Let's build something amazing together!
                    </p>
                `
            },
            resume: {
                title: "My Resume",
                content: `
                    <p class="modal-text">
                        <strong>Download my full resume to learn more about my qualifications and experience.</strong>
                    </p>
                    <p class="modal-text">
                        Key highlights:<br>
                        • Certified in Web Development<br>
                        • Google Analytics Certified<br>
                        • AWS Solutions Architect<br>
                        • Fluent in 3+ programming languages
                    </p>
                `
            }
        };

        function showDetails(type) {
            const modal = document.getElementById('detailsModal');
            const content = modalContent[type];
            
            document.getElementById('modalTitle').textContent = content.title;
            document.getElementById('modalBody').innerHTML = content.content;
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('detailsModal');
            modal.classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('detailsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
